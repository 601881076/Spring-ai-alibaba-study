--- #################### Spring 应用 配置 ###################
server:
  servlet:
    encoding:
      enabled: true
      force: true
      charset: utf-8
  port: 8081

--- #################### ai 配置 ###################
spring:
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY} # 配置大模型访问 key.
      base-url: 'https://ws-uh2v3ki9kl4yvhyu.cn-beijing.maas.aliyuncs.com'
      chat:
        options:
          model: 'qwen3.7-plus'
          #          model: 'deepseek-v4.1-flash'
          # 此模型使用多模态端点，纯文本请求也需启用。
          multi-model: true
